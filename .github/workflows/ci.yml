name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Valores fictícios: só precisam passar na validação de src/env/index.ts
env:
  DATABASE_URL: postgresql://postgres:password@localhost:5432/fit-ai-db
  BETTER_AUTH_SECRET: ci-better-auth-secret
  API_BASE_URL: http://localhost:8080
  WEB_APP_BASE_URL: http://localhost:3000
  GOOGLE_CLIENT_ID: ci
  GOOGLE_CLIENT_SECRET: ci
  GOOGLE_GENERATIVE_AI_API_KEY: ci
  GROQ_API_KEY: ci
  OPENROUTER_API_KEY: ci

jobs:
  check:
    name: Lint, typecheck, unit tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm prisma generate

      - name: Biome
        run: pnpm biome ci .

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: fit-ai-db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm prisma generate

      - name: E2E tests
        run: pnpm test:e2e
